<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Blog</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>Mi Blog</h1>

  <button id="logoutBtn">
    Cerrar Sesión
  </button>

  <hr>

  <h2>Crear Publicación</h2>

  <form id="postForm">

    <input
      type="text"
      id="title"
      placeholder="Título"
    >

    <textarea
      id="content"
      placeholder="Contenido"
    ></textarea>

    <button type="submit">
      Guardar Publicación
    </button>

  </form>

  <hr>

  <div id="postsContainer"></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/blog.js"></script>

</body>
</html>
